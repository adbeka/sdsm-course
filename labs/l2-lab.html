<!doctype html><html lang="ru"><head><meta charset=utf8><title>БЗПД · L2 Lab</title><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lab console — map with zones top-left, device panel right, capture / layers / bytes along the bottom. One dark look. */
:root{
  --bg:#0E1622; --panel:#131D2B; --raise:#1A2638; --line:#26354A; --ink:#E6ECF3; --muted:#93A2B5; --drop:#66758A;
  --accent:#6FA8FF; --accent-deep:#2F6FE0; --on-deep:#F7F9FC; --signal:#F2A541; --on-signal:#1A1206;
  --ok:#4FD08E; --bad:#FF7A6B; --violet:#B48CFF; --hl:rgba(111,168,255,.16);
  --water:#58C2E4; --water-line:#7BD3EF;
  --sans:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p,h1,h2,h3{margin:0}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(0,min(280px,34vh));padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 12px;gap:12px}

/* Top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px 0}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.logo{width:30px;height:30px;background:var(--signal);clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)}
.brand b{display:block;font-size:19px;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{background:none;border:none;padding:6px 12px;border-radius:6px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;color:var(--muted);letter-spacing:.04em}
.fld select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.chk{display:flex;align-items:center;gap:6px;color:var(--ink);cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--signal);width:16px;height:16px}
.btn{background:var(--signal);color:var(--on-signal);border:none;border-radius:7px;padding:9px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.violet{background:var(--violet);color:#160F26}
.spacer{flex:1}
.portal-back{text-decoration:none;font-family:var(--mono);font-size:12.5px;padding:7px 12px}

/* Middle */
.mid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;min-height:0}
.map{position:relative;border-radius:12px;overflow:hidden;background:var(--water);min-height:0}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.card{position:absolute;left:14px;top:14px;max-width:400px;background:rgba(14,22,34,.94);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.12em}
.tag{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:5px;background:var(--raise);color:var(--accent);letter-spacing:.06em;white-space:nowrap}
.tag.mpls{color:var(--signal)} .tag.ctl{color:var(--violet)}
.card h2{font-size:17px;line-height:1.25;text-wrap:balance}
.card p{font-size:13px;line-height:1.5;color:#C9D3E0}
.play{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(14,22,34,.94);border:1px solid var(--line);border-radius:10px;padding:8px 12px;max-width:calc(100% - 28px)}
.play button.ic{width:34px;height:30px;border-radius:6px;background:var(--raise);border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center}
.play svg{position:static;width:14px;height:14px}
.dots{display:flex;gap:4px;align-items:center;overflow-x:auto;max-width:420px;padding:4px 2px}
.dots button{width:10px;height:10px;border-radius:50%;border:none;background:#34465F;cursor:pointer;flex:none;padding:0}
.dots button.done{background:#4E6A90}
.dots button.cur{background:var(--signal);box-shadow:0 0 0 3px rgba(242,165,65,.3)}
.speed{display:flex;gap:2px;font-family:var(--mono);font-size:12px}
.speed button{background:none;border:none;color:var(--muted);padding:4px 6px;border-radius:5px;cursor:pointer}
.speed button[aria-pressed="true"]{background:var(--raise);color:var(--ink)}
.legend{position:absolute;right:14px;bottom:14px;background:rgba(14,22,34,.9);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.dev{cursor:pointer}
.dev:hover .dev-body{filter:brightness(1.15)}

/* Side */
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 10px}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:11px 10px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.pane{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0;flex:1}
.hint{color:var(--muted);font-size:13px;line-height:1.5}
.dlist{display:flex;flex-direction:column;gap:6px}
.ditem{display:flex;align-items:center;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;text-align:left;width:100%}
.ditem:hover{border-color:var(--muted)}
.badge{font-family:var(--mono);font-size:11px;font-weight:600;width:30px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:none}
.b-cl{background:#F5F7FA;color:#1A2638} .b-pe{background:var(--accent-deep);color:var(--on-deep)} .b-p{background:#3A4A62;color:var(--ink)} .b-rr{background:var(--violet);color:#160F26}
.ditem .nm{font-weight:600}
.ditem .sub{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.dhead{display:flex;align-items:center;gap:10px}
.dhead h3{font-size:17px}
.dhead .sub{font-size:12px;color:var(--muted)}
.back{background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-size:13px;align-self:flex-start}
.note{font-size:12px;color:var(--signal)}
.kv{width:100%;border-collapse:collapse;font-size:12.5px}
.kv th,.kv td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.kv th{color:var(--muted);font-weight:500}
.kv td{font-family:var(--mono);font-size:12px}
.kv tr.hit td,.kv tr.hit th{background:rgba(242,165,65,.16)}
.sec{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--drop);margin-top:4px}
.code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 0;font-family:var(--mono);font-size:12px;line-height:1.6;overflow-x:auto}
.ln{white-space:pre;padding:0 12px;border-left:3px solid transparent;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.ln:hover{background:var(--raise)}
.ln.hl{background:var(--hl);border-left-color:var(--accent)}
.ln.cm{color:var(--drop)}
.ln .rel{font-family:var(--sans);font-size:10.5px;color:#160F26;background:var(--violet);border-radius:4px;padding:0 5px;flex:none}
.xp{background:var(--raise);border:1px solid var(--accent);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.xp-s{font-size:13.5px;line-height:1.5}
.xp-parts{display:flex;flex-direction:column;gap:8px}
.xpt{display:flex;flex-direction:column;gap:3px}
.xpt b{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;overflow-wrap:anywhere}
.xpt span{font-size:12.5px;color:var(--muted);line-height:1.4}
.xrel{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.relbtn{background:var(--bg);border:1px solid var(--violet);border-radius:7px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.relbtn b{font-size:12.5px;color:var(--violet)}
.relbtn code{font-family:var(--mono);font-size:11.5px;color:var(--ink);overflow-wrap:anywhere}
.rcard{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.rcard:hover,.rcard.on{border-color:var(--violet)}
.rcard .rt{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.rcard .ok{color:var(--ok);font-size:12px;font-weight:500;white-space:nowrap}
.rpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rpair div{background:var(--bg);border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rpair small{color:var(--muted);font-size:11px}
.rpair code{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.rcard p{font-size:12.5px;color:var(--muted);line-height:1.45}

/* Bottom */
.bottom{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,.85fr);gap:12px;min-height:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.box-h{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.box-h b{font-size:13px}
.box-h input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px}
.box-h .cnt{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.scroll{overflow:auto;min-height:0;flex:1}
.cap{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.cap th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:400;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.cap td{padding:5px 8px;border-bottom:1px solid rgba(38,53,74,.6);white-space:nowrap;cursor:pointer}
.cap tr:hover td{background:var(--raise)}
.cap tr.cur td{background:rgba(242,165,65,.18)}
.cap tr.future td{color:var(--drop)}
.pdot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.layers{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.layers .lt{font-size:13px;font-weight:600}
.layers .ls{font-size:12px;color:var(--muted);line-height:1.45}
details.ly{border:1px solid var(--line);border-radius:7px;background:var(--bg)}
details.ly summary{cursor:pointer;padding:6px 10px;display:flex;justify-content:space-between;gap:8px;font-size:12.5px;list-style:none}
details.ly summary::-webkit-details-marker{display:none}
details.ly summary .lsz{font-family:var(--mono);font-size:11px;color:var(--muted)}
details.ly summary i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}
details.ly .fl{width:100%;border-collapse:collapse;font-size:12px}
details.ly .fl td{padding:3px 10px;vertical-align:top}
details.ly .fl td:first-child{color:var(--muted);white-space:nowrap}
details.ly .fl td:nth-child(2){font-family:var(--mono)}
details.ly .fl td:nth-child(3){color:var(--drop)}
details.ly:hover{border-color:var(--muted)}
.hex{padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.7;display:flex;flex-direction:column;gap:0}
.hrow{display:flex;gap:12px;white-space:nowrap}
.hrow .off{color:var(--drop)}
.hrow span.b{padding:0 1px;border-radius:2px}
.hrow span.b.lit{background:rgba(255,255,255,.18)}
.hleg{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.hleg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}


/* 3D map */
.gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.lbls{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;background:rgba(14,22,34,.92);border:1px solid var(--line);border-radius:7px;padding:5px 10px 6px;pointer-events:auto;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;gap:1px;box-shadow:0 6px 16px -8px rgba(0,0,0,.6)}
.lbl:hover{border-color:var(--signal)}
.lbl b{font-size:12.5px;display:flex;align-items:center;gap:6px}
.lbl b i{width:7px;height:7px;border-radius:50%;display:inline-block}
.lbl span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.lbls.compact .lbl span{display:none}
.lbls.compact .lbl{padding:3px 8px}
.zl{position:absolute;left:0;top:0;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;color:rgba(14,22,34,.78);white-space:nowrap}
.zl.dark{color:rgba(230,236,243,.85)}
.zl.tl{color:#2A1A4A;background:rgba(228,214,255,.85);padding:2px 8px;border-radius:5px;letter-spacing:.02em}
.lbls.compact .zl{font-size:9.5px}
.plbl{position:absolute;left:0;top:0;font-family:var(--mono);font-size:11px;font-weight:700;color:#101828;padding:2px 8px;border-radius:6px;border:1px solid rgba(0,0,0,.4)}
.rlbl{position:absolute;left:0;top:0;background:var(--violet);color:#160F26;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:7px;white-space:nowrap}
.lg-tip{color:var(--drop);font-size:11px}
.ctl-ping{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#tourBtn{display:flex;align-items:center;gap:8px}
#tourBtn .q{width:20px;height:20px;border-radius:50%;background:var(--signal);color:var(--on-signal);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
/* Tour */
.tour{position:fixed;inset:0;z-index:50}
.tour-hole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(5,10,18,.74);border:2px solid var(--signal);transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease;pointer-events:none}
.tour-card{position:fixed;width:min(380px, calc(100vw - 32px));background:var(--panel);border:1px solid var(--signal);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 50px -15px rgba(0,0,0,.8);transition:left .35s ease,top .35s ease}
.tour-n{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--signal)}
.tour-card h3{font-size:17px}
#tourText{font-size:14px;line-height:1.55;color:#C9D3E0}
.tour-btns{display:flex;gap:8px;align-items:center}
.tour-btns .btn{padding:7px 14px}
.tour-btns .btn:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion: reduce){ .tour-hole,.tour-card{transition:none} }

@media (max-width:1100px){
  .legend{display:none}
  body{overflow:auto}
  .app{height:auto;grid-template-rows:auto auto auto}
  .mid{grid-template-columns:1fr}
  .map{aspect-ratio:16/10;max-width:100%}
  .side{max-height:560px}
  .bottom{grid-template-columns:1fr}
  .box{max-height:340px}
}
@media (max-width:640px){
  .map{aspect-ratio:4/5}
  .card{right:14px;max-width:none}
  .card p{font-size:13px}
  .legend{display:none}
  .dots{max-width:140px}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }
</style>

<div class="app">
  <header class="top">
    <a class="btn ghost portal-back" href="../index.html" title="На главную учебного портала">← БЗПД</a>
    <div class="brand"><span class="logo"></span><div><b>L2 Lab</b><small>как кадры проходят L2-канал</small></div></div>
    <div class="seg" role="group" aria-label="Вид канала">
      <button type="button" data-sc="l2c" aria-pressed="true">l2circuit · CH-0001</button>
      <button type="button" data-sc="l2v" aria-pressed="false">l2vpn · L2VPN_DEMO</button>
    </div>
    <div class="ctl-ping"><div class="fld"><label for="from">ОТКУДА</label><select id="from"><option value="A">Клиент A · 10.10.10.1</option><option value="B">Клиент B · 10.10.10.2</option></select></div>
    <label class="chk" for="optArp"><input type="checkbox" id="optArp" checked>ARP</label>
    <label class="chk" for="optReply"><input type="checkbox" id="optReply" checked>Ответ</label>
    <button type="button" class="btn" id="pingBtn">Ping</button></div>
    <button type="button" class="btn violet" id="sigBtn">Сигнализация</button>
    <span class="spacer"></span>
    <button type="button" class="btn ghost" id="tourBtn"><span class="q">?</span>Как читать экран</button>
    <button type="button" class="btn ghost" id="clrBtn">Очистить кэши</button>
  </header>

  <div class="mid">
    <div class="map" id="map">
      <svg id="svg" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Схема L2-канала: клиенты, PE и P-маршрутизаторы">
        <g id="gTiles"></g><g id="gLinks"></g><g id="gRel"></g><g id="gDevs"></g><g id="gPkt"></g>
      </svg>
      <div class="card" id="stepCard" aria-live="polite">
        <div class="card-top"><span id="stepNo"></span><span class="tag" id="stepTag"></span></div>
        <h2 id="stepTitle"></h2>
        <p id="stepText"></p>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:#F2A541"></i>стык с клиентом (AC)</span>
        <span><i style="background:#EEF2F7"></i>MPLS-ядро</span>
        <span><i style="background:#B48CFF"></i>сигнализация / связь</span>
        <span class="lg-tip">перетащите карту, чтобы повернуть</span>
      </div>
      <div class="play">
        <button type="button" class="ic" id="prevBtn" aria-label="Предыдущий шаг"><svg viewBox="0 0 14 14"><path d="M10 2 4 7l6 5z" fill="#E6ECF3"/></svg></button>
        <button type="button" class="ic" id="playBtn" aria-label="Воспроизвести"><svg viewBox="0 0 14 14" id="playIc"><path d="M4 2l8 5-8 5z" fill="#E6ECF3"/></svg></button>
        <button type="button" class="ic" id="nextBtn" aria-label="Следующий шаг"><svg viewBox="0 0 14 14"><path d="M4 2l6 5-6 5z" fill="#E6ECF3"/></svg></button>
        <div class="dots" id="dots"></div>
        <div class="speed" role="group" aria-label="Скорость">
          <button type="button" data-sp="0.5" aria-pressed="false">0.5×</button>
          <button type="button" data-sp="1" aria-pressed="true">1×</button>
          <button type="button" data-sp="2" aria-pressed="false">2×</button>
          <button type="button" data-sp="4" aria-pressed="false">4×</button>
        </div>
      </div>
    </div>

    <aside class="side">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="dev" aria-selected="true">Устройства</button>
        <button type="button" role="tab" data-tab="rel" aria-selected="false">Связи</button>
        <button type="button" role="tab" data-tab="tbl" aria-selected="false">Таблицы</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>

/* ================= Bytes ================= */
const macB = m => m.split(':').map(h => parseInt(h, 16));
const ipB = ip => ip.split('.').map(Number);
const u16 = n => [(n >> 8) & 255, n & 255];
function csum(a){ let s = 0; for (let i = 0; i < a.length; i += 2) s += (a[i] << 8) + (a[i+1] || 0); while (s >> 16) s = (s & 0xffff) + (s >> 16); return (~s) & 0xffff; }
const hx = (n, w) => n.toString(16).padStart(w || 2, '0');
const COL = {eth:'#6FA8FF', q:'#56C7D9', mpls:'#F2A541', vc:'#FFCF70', cw:'#FF8FA3', arp:'#4FD08E', ip:'#7EA6FF', icmp:'#4FD08E', data:'#B48CFF', pad:'#66758A', ctl:'#B48CFF'};

function L(name, color, bytes, fields){ return {name, color, bytes, fields}; }
function ethL(dst, src, type, title){ return L(title || 'Ethernet II', COL.eth, [...macB(dst), ...macB(src), ...(type != null ? u16(type) : [])],
  [['Получатель (dst MAC)', dst, dst === 'ff:ff:ff:ff:ff:ff' ? 'broadcast — всем' : ''], ['Отправитель (src MAC)', src, ''], ...(type != null ? [['EtherType', '0x' + hx(type, 4), type === 0x8847 ? 'MPLS unicast' : '']] : [])]); }
function qL(vlan, type){ return L('802.1Q · VLAN ' + vlan, COL.q, [0x81, 0x00, ...u16(vlan), ...u16(type)],
  [['TPID', '0x8100', 'кадр с тегом'], ['PCP / DEI', '0 / 0', 'приоритет 802.1p'], ['VLAN ID', String(vlan), 'номер VLAN на стыке'], ['EtherType', '0x' + hx(type, 4), type === 0x0806 ? 'ARP' : 'IPv4']]); }
function mplsL(label, s, ttl, title, note){ const v = (label << 12) | (s << 8) | ttl; return L(title + ' · ' + label, s ? COL.vc : COL.mpls, [(v >>> 24) & 255, (v >> 16) & 255, (v >> 8) & 255, v & 255],
  [['Метка', String(label), note], ['TC (EXP)', '0', 'класс обслуживания'], ['S (дно стека)', String(s), s ? 'последняя метка' : 'дальше ещё метка'], ['TTL', String(ttl), '']]); }
function cwL(){ return L('Control word', COL.cw, [0,0,0,0], [['Первый нибл', '0000', 'не 4 и не 6 — кадр не примут за IP'], ['Flags / FRG / Length', '0 / 0 / 0', ''], ['Sequence', '0', 'нумерация не используется']]); }
function arpL(op, sm, si, tm, ti){ return L(op === 1 ? 'ARP · запрос' : 'ARP · ответ', COL.arp,
  [0,1,8,0,6,4,0,op, ...macB(sm), ...ipB(si), ...macB(tm), ...ipB(ti)],
  [['Операция', op === 1 ? '1 (request)' : '2 (reply)', op === 1 ? 'у кого этот IP?' : 'это я'], ['MAC отправителя', sm, ''], ['IP отправителя', si, ''], ['MAC получателя', tm, op === 1 ? 'пока неизвестен' : ''], ['IP получателя', ti, '']]); }
function ipL(src, dst, id, totalLen){ const h = [0x45, 0, ...u16(totalLen), ...u16(id), 0, 0, 64, 1, 0, 0, ...ipB(src), ...ipB(dst)]; const c = csum(h); h[10] = c >> 8; h[11] = c & 255;
  return L('IPv4', COL.ip, h, [['Версия / IHL', '4 / 20 байт', ''], ['Total length', String(totalLen), ''], ['Identification', '0x' + hx(id, 4), ''], ['TTL', '64', 'не меняется в L2-канале: маршрутизаторов по пути нет'], ['Protocol', '1 (ICMP)', ''], ['Header checksum', '0x' + hx(c, 4), 'верна'], ['Источник', src, ''], ['Получатель', dst, '']]); }
const PAYLOAD = Array.from('abcdefghijklmnopqrstuvwabcdefghi').map(c => c.charCodeAt(0));
function icmpL(type){ const h = [type, 0, 0, 0, 0, 1, 0, 1, ...PAYLOAD]; const c = csum(h); h[2] = c >> 8; h[3] = c & 255;
  return [L(type === 8 ? 'ICMP · Echo Request' : 'ICMP · Echo Reply', COL.icmp, h.slice(0, 8), [['Type', String(type), type === 8 ? 'Echo Request' : 'Echo Reply'], ['Checksum', '0x' + hx(c, 4), 'верна'], ['id / seq', '1 / 1', '']]),
          L('Данные', COL.data, PAYLOAD, [['Длина', '32 байта', ''], ['Содержимое', 'abcdefghijklmnopqrstuvwabcdefghi', 'как у ping в Windows']])]; }

/* Frame the client sends, as it is on the AC links */
function clientFrame(kind, src, dst, vlan){
  let ly;
  if (kind === 'arpq') ly = [ethL('ff:ff:ff:ff:ff:ff', MAC[src]), qL(vlan, 0x0806), arpL(1, MAC[src], IP[src], '00:00:00:00:00:00', IP[dst])];
  else if (kind === 'arpr') ly = [ethL(MAC[dst], MAC[src]), qL(vlan, 0x0806), arpL(2, MAC[src], IP[src], MAC[dst], IP[dst])];
  else ly = [ethL(MAC[dst], MAC[src]), qL(vlan, 0x0800), ipL(IP[src], IP[dst], kind === 'echoq' ? 0x1a2b : 0x5c3d, 60), ...icmpL(kind === 'echoq' ? 8 : 0)];
  const n = ly.reduce((s, l) => s + l.bytes.length, 0);
  if (n < 64) ly.push(L('Заполнение', COL.pad, new Array(64 - n).fill(0), [['Длина', (64 - n) + ' байт', 'добивка до минимального кадра']]));
  return ly;
}

/* ================= Steps ================= */
const LINK = {'PE1-P1':[MAC.pe1, MAC.p1a], 'P1-P2':[MAC.p1b, MAC.p2a], 'P2-PE2':[MAC.p2b, MAC.pe2]};
function linkMacs(a, b){ const k = a + '-' + b; if (LINK[k]) return LINK[k]; const r = LINK[b + '-' + a]; return [r[1], r[0]]; }

function dataHops(sc, kind, src){
  const ab = src === 'A', dst = ab ? 'B' : 'A';
  const path = ab ? ['A','PE1','P1','P2','PE2','B'] : ['B','PE2','P2','P1','PE1','A'];
  const vc = ab ? sc.vcAB : sc.vcBA, t = ab ? sc.tAB : sc.tBA;
  const D = sc.dev, inner = clientFrame(kind, src, dst, sc.vlan);
  const pe1 = path[1], pe2 = path[4], peN = D[pe1].name, pe2N = D[pe2].name;
  const ac1 = pe1 === 'PE1' ? (sc.key === 'l2c' ? 'ae10.2331' : 'xe-7/1/2.2952') : (sc.key === 'l2c' ? 'Gi0/2/21.2331' : 'xe-0/0/0.2952');
  const ac2 = pe2 === 'PE1' ? (sc.key === 'l2c' ? 'ae10.2331' : 'xe-7/1/2.2952') : (sc.key === 'l2c' ? 'Gi0/2/21.2331' : 'xe-0/0/0.2952');
  const what = {arpq:'ARP-запрос «у кого ' + IP[dst] + '?»', arpr:'ARP-ответ «' + IP[src] + ' — это я»', echoq:'Echo Request на ' + IP[dst], echor:'Echo Reply на ' + IP[dst]}[kind];
  const proto = kind.startsWith('arp') ? 'ARP' : 'ICMP';
  const via = sc.sig === 'LDP' ? 'в LDP' : 'в BGP';
  const srcN = src === 'A' ? 'Клиент A' : 'Клиент B', dstN = dst === 'A' ? 'Клиент A' : 'Клиент B';
  const hops = [];
  const vsi = pe => sc.key === 'l2c' && pe === 'PE2';
  const info = kind === 'arpq' ? 'Who has ' + IP[dst] + '? Tell ' + IP[src] : kind === 'arpr' ? IP[src] + ' is at ' + MAC[src] : (kind === 'echoq' ? 'Echo Request' : 'Echo Reply') + ' id=1 seq=1 ttl=64';
  const sA = proto === 'ARP' ? MAC[src] : IP[src], dA = proto === 'ARP' ? (kind === 'arpq' ? 'broadcast' : MAC[dst]) : IP[dst];
  const t0 = {arpq:0, arpr:0, echoq:0, echor:0}[kind];
  // hop 0: client -> PE
  hops.push({from:path[0], to:path[1], layer:'L2', tag:'L2 · ETHERNET', proto, ly:inner, label:proto, color:proto === 'ARP' ? '#4FD08E' : '#6FA8FF',
    title:srcN + ': ' + what,
    text:(kind === 'arpq' ? srcN + ' знает только IP соседа. Чтобы узнать его MAC, он спрашивает всех: кадр с MAC получателя ff:ff:ff:ff:ff:ff.' :
          kind === 'arpr' ? srcN + ' отвечает лично: теперь у спрашивающего будет MAC для ' + IP[src] + '.' :
          IP[dst] + ' в той же подсети 10.10.10.0/24, поэтому кадр идёт сразу на MAC получателя, без шлюза.') +
         ' Кадр уходит в порт ' + peN + ' с тегом VLAN ' + sc.vlan + '.',
    src:sA, dst:dA, info, dt:12, tbl:null});
  // hop 1: PE -> P (push)
  const [m1s, m1d] = linkMacs(path[1], path[2]);
  const core1 = [ethL(m1d, m1s, 0x8847, 'Ethernet II · ядро'), mplsL(t[0], 0, 255, 'MPLS · транспортная', 'путь до ' + pe2N), mplsL(vc, 1, 255, 'MPLS · VC-метка', 'метку объявил ' + pe2N + ' ' + via), ...(sc.cw ? [cwL()] : []), ...inner];
  hops.push({from:path[1], to:path[2], layer:'MPLS', tag:'MPLS', proto:'MPLS/' + proto, ly:core1, label:'MPLS', color:'#F2A541',
    title:peN + ': кадр уходит в псевдопровод',
    text:(vsi(pe1) ? peN + ' принимает кадр на ' + ac1 + ' в VSI a2331. VSI запоминает MAC ' + MAC[src] + ' за стыком и ищет получателя в MAC-таблице: ' + (kind === 'arpq' ? 'broadcast рассылается во все порты VSI, кроме входного, — здесь это только PW.' : 'MAC получателя изучен за PW, когда от другого клиента пришёл кадр. Если бы не был изучен, кадр разослался бы во все порты — здесь это тоже только PW.') :
      peN + ' принимает кадр на ' + ac1 + ' и не смотрит на MAC-адреса: канал определяется по входному интерфейсу.' + (kind === 'arpq' ? ' Даже broadcast уходит как обычный кадр: в VPWS отправить его можно только на другую сторону.' : '')) + ' Добавляет CW, VC-метку ' + vc + ' и транспортную метку ' + t[0] + '.',
    src:sA, dst:dA, info:'метки ' + t[0] + ' / ' + vc + ' · ' + info, dt:25, tbl:[{dev:pe1, key:'out'}].concat(vsi(pe1) ? [{dev:'VSI', key:'mac' + src}] : [])});
  // hop 2: P -> P (swap)
  const [m2s, m2d] = linkMacs(path[2], path[3]);
  const core2 = [ethL(m2d, m2s, 0x8847, 'Ethernet II · ядро'), mplsL(t[1], 0, 254, 'MPLS · транспортная', 'заменена ' + t[0] + ' → ' + t[1]), mplsL(vc, 1, 255, 'MPLS · VC-метка', 'не меняется'), ...(sc.cw ? [cwL()] : []), ...inner];
  hops.push({from:path[2], to:path[3], layer:'MPLS', tag:'MPLS', proto:'MPLS/' + proto, ly:core2, label:'MPLS', color:'#F2A541',
    title:D[path[2]].name + ': меняет транспортную метку',
    text:D[path[2]].name + ' смотрит только на верхнюю метку: по таблице меток меняет ' + t[0] + ' на ' + t[1] + ' и уменьшает её TTL. Внутрь кадра не заглядывает.',
    src:sA, dst:dA, info:'метки ' + t[1] + ' / ' + vc + ' · ' + info, dt:2100, tbl:[{dev:path[2], key:t[0]}]});
  // hop 3: P -> PE (PHP)
  const [m3s, m3d] = linkMacs(path[3], path[4]);
  const core3 = [ethL(m3d, m3s, 0x8847, 'Ethernet II · ядро'), mplsL(vc, 1, 255, 'MPLS · VC-метка', 'транспортная снята (PHP)'), ...(sc.cw ? [cwL()] : []), ...inner];
  hops.push({from:path[3], to:path[4], layer:'MPLS', tag:'MPLS', proto:'MPLS/' + proto, ly:core3, label:'MPLS', color:'#F2A541',
    title:D[path[3]].name + ': снимает транспортную метку',
    text:D[path[3]].name + ' — предпоследний перед ' + pe2N + ', поэтому снимает транспортную метку (PHP). Остаётся VC-метка ' + vc + '.',
    src:sA, dst:dA, info:'метка ' + vc + ' · ' + info, dt:1800, tbl:[{dev:path[3], key:t[1]}]});
  // hop 4: PE -> client
  hops.push({from:path[4], to:path[5], layer:'L2', tag:'L2 · ETHERNET', proto, ly:inner, label:proto, color:proto === 'ARP' ? '#4FD08E' : '#6FA8FF',
    title:pe2N + ': отдаёт кадр клиенту',
    text:(vsi(pe2) ? pe2N + ' по VC-метке ' + vc + ' находит VSI a2331 и снимает метку и CW. VSI запоминает MAC ' + MAC[src] + ' за PW и ' + (kind === 'arpq' ? 'рассылает broadcast во все порты, кроме PW, — это стык ' + ac2 + '.' : 'по MAC-таблице отправляет кадр в стык ' + ac2 + '.') :
      pe2N + ' по VC-метке ' + vc + ' находит свой стык ' + ac2 + ', снимает метку и CW и отдаёт кадр как есть.') + (proto === 'ICMP' ? ' TTL в IP по-прежнему 64: для клиентов маршрутизаторов по пути не было.' : ' ' + dstN + ' получил кадр.'),
    src:sA, dst:dA, info, dt:30, tbl:[{dev:pe2, key:'in'}].concat(vsi(pe2) ? [{dev:'VSI', key:'mac' + src}] : [])});
  return hops;
}

  if (sc.sig === 'LDP') {

  }
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(e){

  cv.addEventListener('dblclick', () => { yawT = -0.18; });
  requestAnimationFrame(frame);
  let dead = false;
  function kill(){ dead = true; cv.remove(); lbls.remove(); $('#svg').style.display = ''; }
  return {build, place, set, ring:ringOn, pulse, rel, kill, get dead(){ return dead; }};
}

/* ================= Runs ================= */
function buildPing(){
  const sc = S.sc, src = $('#from').value, dst = src === 'A' ? 'B' : 'A';
  let steps = [];
  if ($('#optArp').checked && !S.arpCached) { steps = steps.concat(dataHops(sc, 'arpq', src), dataHops(sc, 'arpr', dst)); }
  steps = steps.concat(dataHops(sc, 'echoq', src));
  if ($('#optReply').checked) steps = steps.concat(dataHops(sc, 'echor', dst));
  setRun(steps, 'ping');
}
function buildSig(){ setRun(sigSteps(S.sc), 'sig'); }
function setRun(steps, kind){
  stop();
  S.runNo++; S.kind = kind;
  let t = 0; steps.forEach(s => { t += s.dt; s.time = t; s.len = s.ly[0].bytes ? s.ly.reduce((n, l) => n + l.bytes.length, 0) : null; });
  S.steps = steps; S.idx = 0;
  renderDots(); renderCap(); showStep(0, false);
}

/* ================= Playback ================= */
function showStep(i, animate){
  const st = S.steps[i]; if (!st) return Promise.resolve();
  S.idx = i;
  $('#stepNo').textContent = 'ПРОГОН #' + S.runNo + ' · ШАГ ' + (i + 1) + ' / ' + S.steps.length;
  const tg = $('#stepTag'); tg.textContent = st.tag; tg.className = 'tag' + (st.layer === 'MPLS' ? ' mpls' : st.layer === 'CTL' ? ' ctl' : '');
  $('#stepTitle').textContent = st.title; $('#stepText').textContent = st.text;
  if (HAS_ANIME && !reduce && animate) anime({targets:'#stepCard', opacity:[.4,1], duration:300, easing:'easeOutQuad'});
  $('#dots').querySelectorAll('button').forEach((b, k) => b.className = k < i ? 'done' : k === i ? 'cur' : '');
  const cur = $('#dots').children[i]; if (cur && cur.scrollIntoView) cur.scrollIntoView({block:'nearest', inline:'center'});
  document.querySelectorAll('#capBody tr').forEach(tr => { const k = +tr.dataset.i; tr.classList.toggle('cur', k === i); tr.classList.toggle('future', k > i); });
  const row = document.querySelector('#capBody tr.cur'); if (row) row.scrollIntoView({block:'nearest'});
  renderLayers(st); renderHex(st);
  if (S.tab === 'tbl') renderPane();
  const ms = animate ? 1150 / S.speed * (st.path && st.path.length > 2 ? 1.6 : 1) : 0;
  return animatePkt(st, ms).then(() => { if (animate) pulse(st.to); });
}
async function play(){
  if (S.playing) { stop(); return; }
  S.playing = true; setPlayIcon(); const run = ++S.run;
  if (S.idx >= S.steps.length - 1) S.idx = -1;
  while (S.playing && run === S.run && S.idx < S.steps.length - 1) {
    await showStep(S.idx + 1, true);
    if (!S.playing || run !== S.run) break;
    await new Promise(r => setTimeout(r, 380 / S.speed));
  }
  if (run === S.run) { S.playing = false; setPlayIcon(); if (S.kind === 'ping' && S.idx === S.steps.length - 1) S.arpCached = true; }
}
function stop(){ S.playing = false; S.run++; if (HAS_ANIME) anime.running.slice().forEach(a => { if (!a.loop) a.pause(); }); setPlayIcon(); }
function setPlayIcon(){ $('#playIc').innerHTML = S.playing ? '<path d="M3 2h3v10H3zM8 2h3v10H8z" fill="#E6ECF3"/>' : '<path d="M4 2l8 5-8 5z" fill="#E6ECF3"/>'; $('#playBtn').setAttribute('aria-label', S.playing ? 'Пауза' : 'Воспроизвести'); }

      const l = el('div', 'dlist');
      Object.keys(sc.dev).forEach(id => { const d = sc.dev[id]; const b = el('button', 'ditem'); b.type = 'button';
        b.append(el('span', 'badge b-' + d.kind, {cl:'PC', pe:'PE', p:'P', rr:'RR'}[d.kind]), el('span', 'nm', d.name), el('span', 'sub', d.sub));
        b.addEventListener('click', () => openDev(id)); l.appendChild(b); });
      p.appendChild(l); return;
    }
    const d = sc.dev[S.dev];
    const back = el('button', 'back', '← Все устройства'); back.type = 'button'; back.addEventListener('click', () => { S.dev = null; showRel(null); renderPane(); }); p.appendChild(back);
    const h = el('div', 'dhead'); h.append(el('span', 'badge b-' + d.kind, {cl:'PC', pe:'PE', p:'P', rr:'RR'}[d.kind]));
    const ht = el('div'); ht.append(el('h3', null, d.name), el('p', 'sub', d.vendor)); h.appendChild(ht); p.appendChild(h);
    if (d.note) p.appendChild(el('p', 'note', d.note));
    p.appendChild(el('p', 'sec', 'КОНФИГУРАЦИЯ'));
    const code = el('div', 'code');
    (sc.cfg[S.dev] || []).forEach(([key, txt]) => {
      const ln = el('div', 'ln' + (txt.startsWith('#') ? ' cm' : '') + (S.line === key ? ' hl' : '')); ln.appendChild(el('span', null, txt));
      const rs = relsFor(S.dev, key); if (rs.length) ln.appendChild(el('span', 'rel', '⇄ связь'));
      ln.addEventListener('click', () => { S.line = key; const r = relsFor(S.dev, key); showRel(r[0] || null); renderPane(); });
      code.appendChild(ln);
    });
    p.appendChild(code);
    if (S.line && LX[S.line]) {
      const x = LX[S.line], xp = el('div', 'xp');
      xp.appendChild(el('p', 'xp-s', x.s));
      const parts = el('div', 'xp-parts'); x.p.forEach(([a, b]) => { const t = el('div', 'xpt'); t.append(el('b', null, a), el('span', null, b)); parts.appendChild(t); }); xp.appendChild(parts);
      const rs = relsFor(S.dev, S.line);
      if (rs.length) { const xr = el('div', 'xrel'); rs.forEach(r => { const other = r.a[0] === S.dev ? r.b : r.a;
        const b = el('button', 'relbtn'); b.type = 'button'; b.append(el('b', null, '⇄ ' + r.t + ' · ' + sc.dev[other[0]].name), el('code', null, other[2] + '  ✓ совпадает'), el('span', 'hint', r.why));
        b.addEventListener('click', () => { S.dev = other[0]; S.line = other[1]; showRel(r); renderPane(); }); xr.appendChild(b); }); xp.appendChild(xr); }
      p.appendChild(xp);
      if (HAS_ANIME && !reduce) anime({targets:xp, opacity:[0,1], translateY:[6,0], duration:260, easing:'easeOutQuad'});
    } else p.appendChild(el('p', 'hint', 'Нажмите на строку конфигурации, чтобы разобрать её по словам.'));
  } else if (S.tab === 'rel') {
    p.appendChild(el('p', 'hint', 'Что должно совпасть между устройствами. Нажмите на связь — она появится на карте.'));
    sc.rel.forEach(r => {
      const c = el('button', 'rcard' + (S.rel === r.id ? ' on' : '')); c.type = 'button';
      const rt = el('div', 'rt'); rt.append(el('span', null, r.t), el('span', 'ok', '✓ совпадает')); c.appendChild(rt);
      const pr = el('div', 'rpair'); [r.a, r.b].forEach(s => { const d = el('div'); d.append(el('small', null, sc.dev[s[0]].name), el('code', null, s[2])); pr.appendChild(d); }); c.appendChild(pr);
      c.appendChild(el('p', null, r.why));
      c.addEventListener('click', () => { showRel(r); renderPane(); });
      p.appendChild(c);
    });
  } else {
    p.appendChild(el('p', 'hint', 'Таблицы после сигнализации. Строка, которую использует текущий шаг, подсвечена. Номера меток условные.' + (sc.key === 'l2c' ? ' У Huawei VSI есть ещё MAC-таблица: Juniper в l2circuit MAC не изучает, а VSI изучает.' : ' В l2vpn обе стороны — VPWS: MAC-адреса не изучаются.')));
    const st = S.steps[S.idx], hit = st && st.tbl;
    tables(sc).forEach(t => {
      p.appendChild(el('p', 'sec', t.title.toUpperCase()));
      const tb = el('table', 'kv'); const hr = document.createElement('tr'); t.cols.forEach(c => hr.appendChild(el('th', null, c))); tb.appendChild(hr);
      t.rows.forEach(r => { const tr = document.createElement('tr'); if (hit && hit.some(h => h.dev === t.dev && String(h.key) === String(r.key))) tr.className = 'hit'; r.c.forEach((v, k) => tr.appendChild(el(k === 0 && t.cols[0] === 'Что' ? 'th' : 'td', null, v))); tb.appendChild(tr); });
      p.appendChild(tb);
    });
  }
}

/* ================= Wiring ================= */
function setScenario(k){
  stop(); S.sc = SC[k]; S.dev = null; S.line = null; S.arpCached = false;
  document.querySelectorAll('[data-sc]').forEach(b => b.setAttribute('aria-pressed', b.dataset.sc === k ? 'true' : 'false'));
  $('#from').options[0].textContent = 'Клиент A · 10.10.10.1'; $('#from').options[1].textContent = 'Клиент B · 10.10.10.2';
  drawTiles(S.sc); drawLinks(S.sc); drawDevs(S.sc); showRel(null);
  buildPing(); renderPane();
}
document.querySelectorAll('[data-sc]').forEach(b => b.addEventListener('click', () => setScenario(b.dataset.sc)));
$('#pingBtn').addEventListener('click', () => { buildPing(); play(); });
$('#sigBtn').addEventListener('click', () => { buildSig(); play(); });
$('#clrBtn').addEventListener('click', () => { S.arpCached = false; buildPing(); });
['#optArp', '#optReply', '#from'].forEach(s => $(s).addEventListener('change', buildPing));
$('#playBtn').addEventListener('click', play);
$('#prevBtn').addEventListener('click', () => step(-1));
$('#nextBtn').addEventListener('click', () => step(1));
document.querySelectorAll('[data-sp]').forEach(b => b.addEventListener('click', () => { S.speed = +b.dataset.sp; document.querySelectorAll('[data-sp]').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); }));
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
$('#filter').addEventListener('input', renderCap);
document.addEventListener('keydown', e => {
  if (!$('#tour').hidden) { if (e.key === 'Escape') tourClose(); else if (e.key === 'ArrowRight') { e.preventDefault(); $('#tourNext').click(); } else if (e.key === 'ArrowLeft') { e.preventDefault(); tourGo(tIdx - 1); } return; }
  const t = (e.target.tagName || '').toLowerCase(); if (t === 'input' || t === 'select') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
  else if (e.key === ' ' && t !== 'button') { e.preventDefault(); play(); }
});
G3 = init3D();
setScenario('l2c');
if (HAS_ANIME && !reduce) anime({targets:'#tourBtn', boxShadow:['0 0 0 0 rgba(242,165,65,.7)', '0 0 0 10px rgba(242,165,65,0)'], duration:1400, delay:900, loop:3, easing:'easeOutQuad'});
})();
</script>
